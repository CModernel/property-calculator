name: CI

# Runs the same three checks the project's standing convention requires before
# any change is considered done: tests, lint, build.
#
# main is deliberately excluded here - deploy.yml runs these same steps on a
# push to main, before it builds the artifact, so covering main in both would
# just double the work for the same signal.
on:
  push:
    branches-ignore:
      - main
  pull_request:

# A rapid series of pushes to the same branch only needs the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so this file and deploy.yml can never drift onto
          # different Node versions. The version there is not arbitrary: it has
          # to satisfy package.json's `engines`, which jsdom 30 constrains
          # tightly. Pinning below that floor still installs (npm only warns)
          # and then fails at runtime - .npmrc's engine-strict now turns that
          # into an install-time error instead.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
